name: WasteOps quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasteops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/$archive"
          # SHA-256 matches the official Gitleaks v8.30.1 Linux x64 release checksums.
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify root-commit detection
        run: bash .github/test-gitleaks-root-scan.sh
      - name: Scan every reachable Git commit
        run: bash .github/scan-full-history.sh

  container-smoke:
    name: Runtime container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag wasteops:ci .
      - name: Smoke-test public route and environment-file exclusion
        shell: bash
        run: |
          set -euo pipefail
          container_name="wasteops-ci-${GITHUB_RUN_ID}"
          auth_secret="$(openssl rand -hex 48)"
          cleanup() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:3000:3000 \
            --env "AUTH_SECRET=$auth_secret" \
            --env 'POSTGRES_DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build?schema=public' \
            wasteops:ci >/dev/null
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --max-time 3 --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs "$container_name" 2>&1 | sed "s/${auth_secret}/[REDACTED]/g" | tail -n 80 >&2
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:3000/manus-routes.json > "$RUNNER_TEMP/manus-routes.json"
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!Array.isArray(data.routes) || !data.routes.some(route => route.path === "/")) process.exit(1);' "$RUNNER_TEMP/manus-routes.json"
          if ! docker exec "$container_name" sh -ec 'test -z "$(find /app -type f \( -name ".env" -o -name ".env.*" \) -print -quit)' ; then
            echo 'Runtime container contains an environment file.' >&2
            exit 1
          fi
          echo 'Container served the landing and route manifest; no .env files are present.'

  verify:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wasteops
          POSTGRES_USER: wasteops
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasteops -d wasteops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      POSTGRES_DATABASE_URL: postgresql://wasteops@127.0.0.1:5432/wasteops?schema=public
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      INITIAL_ADMIN_EMAIL: admin@example.test
      INITIAL_ADMIN_NAME: CI Administrator
      INITIAL_SUPERVISOR_EMAIL: supervisor@example.test
      INITIAL_COLLECTOR_EMAIL: collector@example.test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7
        with:
          node-version: "22"
          cache: npm
      - name: Generate per-run authentication fixtures
        shell: bash
        run: |
          {
            printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 48)"
            printf 'INITIAL_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'INITIAL_SUPERVISOR_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'INITIAL_COLLECTOR_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - run: npm audit --audit-level=high

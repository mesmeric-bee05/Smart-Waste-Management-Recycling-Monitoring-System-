services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wasteops
      POSTGRES_USER: wasteops
      POSTGRES_PASSWORD: wasteops_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wasteops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteops -d wasteops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wasteops-postgres:
